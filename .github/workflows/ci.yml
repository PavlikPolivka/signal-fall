name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Headless smoke run
        run: pnpm headless run --seed 1 --ticks 10000
      - name: Sim benchmark
        run: pnpm headless bench
      - name: AI acceptance (Hard beats Easy in >= 90% of 200 matches)
        run: pnpm headless balance --matches 200 --size M --min-win 90 --out balance-hard-easy.csv
      - name: Faction balance (every pairing 45-55% over 300 Hard matches)
        run: |
          pnpm headless balance --a holdout:hard --b halcyon:hard --matches 300 --min-win 45 --max-win 55 --out balance-holdout-halcyon.csv
          pnpm headless balance --a holdout:hard --b choir:hard --matches 300 --min-win 45 --max-win 55 --out balance-holdout-choir.csv
          pnpm headless balance --a halcyon:hard --b choir:hard --matches 300 --min-win 45 --max-win 55 --out balance-halcyon-choir.csv
      - name: Build and initial-load size budget (15 MB)
        run: pnpm build && pnpm size
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: |
            test-results/
            balance-*.csv
          retention-days: 7

  backend:
    # Supabase stack in Docker: migrations, row level security, the TURN function, and
    # two separate browser profiles playing over Realtime signaling.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - run: supabase start
      - name: Serve edge functions
        run: supabase functions serve > functions.log 2>&1 &
      - name: Backend tests and online multiplayer
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          export SUPABASE_URL=$API_URL SUPABASE_ANON_KEY=$ANON_KEY SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY
          sleep 5
          pnpm exec vitest run tools/backend-tests
          pnpm exec playwright install --with-deps chromium
          pnpm e2e --project=chromium e2e/multiplayer.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend
          path: |
            functions.log
            test-results/
          retention-days: 7
