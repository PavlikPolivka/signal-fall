name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Headless smoke run
        run: pnpm headless run --seed 1 --ticks 10000
      - name: Sim benchmark
        run: pnpm headless bench
      - name: Build and initial-load size budget (15 MB)
        run: pnpm build && pnpm size
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: |
            test-results/
          retention-days: 7

  balance:
    # Every faction pairing, 300 Hard AI matches each, plus Hard vs Easy. The results go to the
    # balance-data branch (main only), where the game's Codex reads them, whether or not they pass.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Balance (each pairing 45-55%, Hard beats Easy >= 90%)
        id: balance
        run: pnpm -s headless balance-report --out "$GITHUB_WORKSPACE/balance.json" --csv "$GITHUB_WORKSPACE"
      - name: Publish results for the game
        if: always() && github.ref == 'refs/heads/main' && hashFiles('balance.json') != ''
        run: |
          mkdir publish && cp balance.json publish/
          echo '{ "git": { "deploymentEnabled": false } }' > publish/vercel.json
          cd publish
          git init -q -b balance-data
          git add -A && git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Balance for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" balance-data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balance
          path: |
            balance.json
            balance-*.csv
          retention-days: 14

  backend:
    # Supabase stack in Docker: migrations, row level security, the TURN function, and
    # two separate browser profiles playing over Realtime signaling.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - run: supabase start
      - name: Serve edge functions
        run: supabase functions serve > functions.log 2>&1 &
      - name: Backend tests and online multiplayer
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          export SUPABASE_URL=$API_URL SUPABASE_ANON_KEY=$ANON_KEY SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY
          sleep 5
          pnpm exec vitest run tools/backend-tests
          pnpm exec playwright install --with-deps chromium
          pnpm e2e --project=chromium e2e/multiplayer.spec.ts e2e/account.spec.ts e2e/stats.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend
          path: |
            functions.log
            test-results/
          retention-days: 7
